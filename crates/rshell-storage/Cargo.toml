[package]
name = "rshell-storage"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
test-support = []

[dependencies]
async-trait = "0.1"
keyring = { version = "=4.1.5", default-features = false, features = ["v1"] }
rshell-core = { path = "../rshell-core" }
rshell-platform = { path = "../rshell-platform" }
rusqlite = { version = "0.37", features = ["bundled"] }
secrecy = "=0.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "sync", "time"] }
uuid = { version = "1.23.0", features = ["v4"] }
zeroize = "=1.9.0"

[dev-dependencies]
tempfile = "3.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
